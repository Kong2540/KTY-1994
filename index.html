<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KTY1994 เช็คชื่อพนักงาน</title>
<meta name="theme-color" content="#24323A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KTY เช็คชื่อ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --concrete:#E9ECEA; --surface:#FFFFFF; --surface-2:#F4F6F5;
  --ink:#1E2A30; --ink-2:#55646B; --line:#D3D9D7;
  --slate:#24323A; --slate-ink:#FFFFFF;
  --safety:#F2B705; --safety-ink:#2A2100;
  --ok:#2F7D4F; --warn:#B26A00; --bad:#B3322B;
  --ok-bg:#E3F1E8; --warn-bg:#FBEFD9; --bad-bg:#F8E1DF;
  --radius-s:6px; --radius-m:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --concrete:#151B1E; --surface:#1E262A; --surface-2:#252F34;
    --ink:#E6EBEA; --ink-2:#9AA8AD; --line:#34424A;
    --slate:#3A4C56; --slate-ink:#FFFFFF;
    --safety:#F2B705; --safety-ink:#2A2100;
    --ok:#6CC08E; --warn:#E7A746; --bad:#EE7A72;
    --ok-bg:#1F3328; --warn-bg:#3A2D17; --bad-bg:#3D2321;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Thai",Tahoma,"Segoe UI",sans-serif;background:var(--concrete);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--safety);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.hidden{display:none!important}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth-box{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mark{width:44px;height:44px;border-radius:8px;background:var(--slate);display:grid;place-items:center;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(135deg,var(--safety) 0 6px,var(--slate) 6px 12px)}
.brand-mark span{color:#fff;font-weight:700;font-size:15px;margin-bottom:6px}
.brand h1{font-size:20px;margin:0;line-height:1.2}
.brand p{margin:0;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-6px -6px 18px}
.tabs button{flex:1;background:none;border:0;padding:10px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--safety)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-2)}
.field .err{font-size:12px;color:var(--bad)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);min-height:42px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--slate);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--safety) 45%,transparent)}
.row{display:grid;gap:12px}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:1fr 1fr 1fr}
.date3{display:grid;grid-template-columns:70px 1fr 90px;gap:6px}
@media (max-width:520px){.row-2,.row-3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--slate);border-color:var(--slate);color:var(--slate-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--slate) 85%,#000)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-block{width:100%}
.btn-sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
.linkbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:4px 0;font-size:13px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--slate);color:#E8EEEC;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{margin:4px 6px 22px}
.side .brand-mark{background:#18232A}
.side .brand-mark::after{background:repeating-linear-gradient(135deg,var(--safety) 0 6px,#18232A 6px 12px)}
.side .brand h1{color:#fff;font-size:16px}
.side .brand p{color:#AFC0C4}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);color:#D5DFDD;text-decoration:none;font-weight:500;border-left:4px solid transparent}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--safety)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.side-foot .who{color:#fff;font-weight:600}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#E8EEEC;border-radius:var(--radius-s);padding:6px 10px;margin-top:8px;font-size:13px}
.main{padding:24px clamp(14px,3vw,36px) 40px;min-width:0}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:24px;line-height:1.25}
.page-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.bottomnav{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--slate);color:#fff;position:sticky;top:0;z-index:20}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--slate)}
  .topbar .brand{margin:0}
  .topbar .brand-mark{width:34px;height:34px;background:#18232A}
  .topbar .brand-mark::after{height:5px;background:repeating-linear-gradient(135deg,var(--safety) 0 5px,#18232A 5px 10px)}
  .topbar .brand-mark span{font-size:12px;margin-bottom:4px}
  .topbar .brand h1{color:#fff;font-size:15px}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--radius-s);padding:5px 10px;font-size:13px}
  .main{padding-bottom:96px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:11px;color:var(--ink-2);text-decoration:none;border-top:3px solid transparent}
  .bottomnav a.on{color:var(--ink);border-top-color:var(--safety);font-weight:600}
  .bottomnav svg{width:22px;height:22px}
}

/* ---------- content ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
.card-pad{padding:18px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);overflow:hidden;margin-bottom:18px}
.stat{padding:14px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.grid-2{grid-template-columns:1fr}}
.section-title{font-size:16px;margin:0 0 12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 32px;align-items:center;gap:10px;font-size:14px}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--slate)}
.notice{padding:12px 14px;border-radius:var(--radius-s);background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--safety);font-size:14px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1 1 220px}
.toolbar select{flex:0 1 170px;width:auto}

table.list{width:100%;border-collapse:collapse}
.list th{text-align:left;font-size:13px;color:var(--ink-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:var(--surface-2)}
.person{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.person small{display:block;color:var(--ink-2);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag-bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.scroll-x{overflow-x:auto}
@media (max-width:700px){
  .list thead{display:none}
  .list, .list tbody, .list tr, .list td{display:block;width:100%}
  .list tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .list td{border:0;padding:2px 0}
  .list td.hide-m{display:none}
  .list td[data-l]::before{content:attr(data-l) " ";color:var(--ink-2);font-size:12px}
}

/* stars */
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:16px;height:16px}
.stars.lg svg{width:22px;height:22px}

/* empty */
.empty{padding:36px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,19,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius-m);width:100%;max-width:680px;border:1px solid var(--line);animation:pop .16s ease-out}
.modal-sm{max-width:440px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:18px}
.modal-head button{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-2);padding:4px 8px}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fieldset{border:0;padding:0;margin:0 0 8px}
.fieldset legend{font-weight:700;font-size:15px;padding:0;margin-bottom:10px}
.fieldset + .fieldset{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.reason-box{background:var(--warn-bg);border-radius:var(--radius-s);padding:12px;margin-top:4px}

/* employee ID card */
.idcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.idcard-top{background:var(--slate);color:#fff;padding:16px 18px 22px;position:relative}
.idcard-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(135deg,var(--safety) 0 8px,var(--slate) 8px 16px)}
.idcard-top .co{font-size:12px;color:#B9C8CB}
.idcard-top .nm{font-size:22px;font-weight:700;line-height:1.25;margin-top:6px}
.idcard-top .nn{color:#DCE5E3;font-size:14px}
.idcard-top .code{position:absolute;right:18px;top:16px;font-weight:600;font-size:13px;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:4px}
.idcard-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.idcard-body div{padding:11px 18px;border-bottom:1px solid var(--line)}
.idcard-body div:nth-child(odd){border-right:1px solid var(--line)}
.idcard-body dt{font-size:12px;color:var(--ink-2)}
.idcard-body dd{margin:0;font-weight:600}
.idcard-body .wide{grid-column:1/-1;border-right:0!important}
@media (max-width:520px){.idcard-body{grid-template-columns:1fr}.idcard-body div{border-right:0!important}}

/* user rows */
.urow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow.pending{background:var(--warn-bg)}
@media (max-width:760px){.urow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface)}
.chip input{margin:0}

/* settings list */
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.slist li span{flex:1}

/* toast & overlays */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--radius-s);z-index:90;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.offline{position:fixed;inset:0;z-index:100;background:rgba(10,16,19,.8);display:grid;place-items:center;padding:24px;color:#fff;text-align:center}
.offline div{max-width:340px}
.offline b{display:block;font-size:20px;margin-bottom:6px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-2)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--slate);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div>กำลังเชื่อมต่อระบบ</div></div></div>
<div id="offline" class="offline hidden"><div><b>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</b>ระบบนี้บันทึกได้เฉพาะตอนออนไลน์ เพื่อให้ข้อมูลตรงกันทุกเครื่อง เชื่อมต่อเน็ตแล้วหน้านี้จะหายไปเอง</div></div>

<script>
	/* =====================================================================
	ตั้งค่าการเชื่อมต่อ Supabase — นำค่ามาจาก Project Settings > API
	===================================================================== */
	const SUPABASE_URL = 'https://mydytzlrevzjpqusaohu.supabase.co';
	const SUPABASE_ANON_KEY = 'sb_publishable_btZKjUqx12VOyTnyMAZOGQ_jpmiLHfl';
	const COMPANY = 'หจก.กิตติยาก่อสร้าง 1994';

	/* ---------- ค่าคงที่ ---------- */
	const ROLES = {
	pending:   'รออนุมัติ',
	employee:  'พนักงาน',
	foreman:   'โฟร์แมน/วิศวกร',
	executive: 'ผู้บริหาร',
	admin:     'แอดมิน'
	};
	const TITLES = ['นาย','นาง','นางสาว','ว่าที่ ร.ต.','อื่น ๆ'];
	const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
	const TH_MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
	const ICON = {
	home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.7-.2 4.8 1.5 5.5 4.4"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/></svg>'
};

/* ---------- state ---------- */
const S = { session:null, profile:null, positions:[], sites:[], employees:[], route:'home' };
let sb;

/* ---------- utils ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localISO = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const money = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(msg, bad=false){
  const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), bad?5000:2600);
}
function parseISO(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return {y,m,d}; }
function thaiDate(iso, short=true){
  const p=parseISO(iso); if(!p) return '-';
  return `${p.d} ${(short?TH_MONTHS_S:TH_MONTHS)[p.m-1]} ${p.y+543}`;
}
function ageOf(iso, ref=new Date()){
  const p=parseISO(iso); if(!p) return null;
  let y=ref.getFullYear()-p.y, m=(ref.getMonth()+1)-p.m;
  if(ref.getDate()<p.d) m--;
  if(m<0){ y--; m+=12; }
  return {y,m};
}
const ageText = iso => { const a=ageOf(iso); return a ? `${a.y} ปี${a.m?` ${a.m} เดือน`:''}` : '-'; };
const serviceText = iso => { const a=ageOf(iso); if(!a) return '-'; if(a.y<0) return 'ยังไม่เริ่มงาน'; return a.y ? `${a.y} ปี ${a.m} เดือน` : `${a.m} เดือน`; };
function validThaiId(id){
  if(!/^\d{13}$/.test(id)) return false;
  let s=0; for(let i=0;i<12;i++) s+=Number(id[i])*(13-i);
  return (11 - s%11)%10 === Number(id[12]);
}
const fmtId = id => id && id.length===13 ? `${id[0]}-${id.slice(1,5)}-${id.slice(5,10)}-${id.slice(10,12)}-${id[12]}` : (id||'-');

function starsHTML(v, lg=false){

const errText = e => {
  const m = (e && (e.message||e.error_description)) || String(e);
  const map = {
    'Invalid login credentials':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
    'User already registered':'อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบ หรือกดลืมรหัสผ่าน',
    'Email not confirmed':'ยังไม่ได้ยืนยันอีเมล กรุณาเปิดลิงก์ยืนยันในอีเมลก่อน',
    'Password should be at least 6 characters.':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'
  };
  if(map[m]) return map[m];
  if(/duplicate key.*national_id/.test(m)) return 'เลขบัตรประชาชนนี้มีในระบบแล้ว';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต';
  return m;
};
function busy(btn, on, label){
  if(!btn) return;
  if(on){ btn.dataset.l=btn.textContent; btn.disabled=true; btn.textContent=label||'กำลังบันทึก...'; }
  else { btn.disabled=false; if(btn.dataset.l) btn.textContent=btn.dataset.l; }
}

/* date picker: วัน / เดือน / ปี พ.ศ. */
function dateField(name, iso, label, hint=''){
  const p=parseISO(iso)||{};
  let days='<option value="">วัน</option>'; for(let i=1;i<=31;i++) days+=`<option ${p.d===i?'selected':''}>${i}</option>`;
  let mons='<option value="">เดือน</option>'; TH_MONTHS.forEach((m,i)=> mons+=`<option value="${i+1}" ${p.m===i+1?'selected':''}>${m}</option>`);
  return `<div class="field"><label>${label}</label>
    <div class="date3" data-date="${name}">
      <select data-p="d" aria-label="วัน">${days}</select>
      <select data-p="m" aria-label="เดือน">${mons}</select>
      <input type="number" data-p="y" placeholder="พ.ศ." inputmode="numeric" min="2440" max="2700" value="${p.y?p.y+543:''}" aria-label="ปี พ.ศ.">
    </div><span class="hint" data-hint="${name}">${hint}</span></div>`;
}
function readDate(root, name){
  const w=$(`[data-date="${name}"]`, root);
  const d=+$('[data-p=d]',w).value, m=+$('[data-p=m]',w).value, yb=+$('[data-p=y]',w).value;
  if(!d && !m && !yb) return {ok:true, value:null};
  if(!d || !m || !yb) return {ok:false, msg:'กรอกวัน เดือน และปี พ.ศ. ให้ครบ'};
  const y=yb-543;
  const dt=new Date(y, m-1, d);
  if(dt.getMonth()!==m-1 || y<1900 || y>2200) return {ok:false, msg:'วันที่ไม่ถูกต้อง'};
  return {ok:true, value:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
}

/* modal */
function openModal(html, cls=''){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  const esck=e=>{ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esck);} };
  document.addEventListener('keydown',esck);
  setTimeout(()=>{ const f=bg.querySelector('input,select,textarea'); if(f) f.focus(); },50);
  return {el:bg, close};
}
function confirmBox(msg, okText='ยืนยัน', danger=false){
  return new Promise(res=>{
    const m=openModal(`<div class="modal-head"><h3>ยืนยัน</h3><button data-close aria-label="ปิด">×</button></div>
      <div class="modal-body">${esc(msg)}</div>
      <div class="modal-foot"><button class="btn" data-close>ยกเลิก</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="cOk">${esc(okText)}</button></div>`,'modal-sm');
    m.el.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>res(false)));
    $('#cOk',m.el).onclick=()=>{ m.close(); res(true); };
  });
}

function watchOnline(){
  const upd=()=>$('#offline').classList.toggle('hidden', navigator.onLine);
  window.addEventListener('online',upd); window.addEventListener('offline',upd); upd();
}

async function boot(){
  watchOnline();
  if(SUPABASE_URL.includes('YOUR-PROJECT')){
    $('#app').innerHTML=`<div class="auth"><div class="auth-box panel"><h3 style="margin-top:0">ยังไม่ได้ตั้งค่าการเชื่อมต่อ</h3><p>เปิดไฟล์ index.html แล้วใส่ค่า <b>SUPABASE_URL</b> และ <b>SUPABASE_ANON_KEY</b> ตามคู่มือติดตั้ง</p></div></div>`;
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY'){ S.session=session; renderNewPassword(); return; }
    if(event==='SIGNED_OUT'){ S.session=null; S.profile=null; renderAuth(); }
  });
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if(location.hash.includes('type=recovery')) return; // รอ event PASSWORD_RECOVERY
  if(S.session) await enter(); else renderAuth();
}

async function enter(){
  if(/access_token|type=/.test(location.hash)) history.replaceState(null,'',location.pathname);
  const { data, error } = await sb.from('profiles').select('*').eq('id', S.session.user.id).single();
  if(error){ toast(errText(error), true); renderAuth(); return; }
  S.profile = data;
  if(data.role==='pending' || !data.is_active){ renderPending(); return; }
  await loadRefs();
  window.onhashchange = route;
  route();
}

async function loadRefs(){
  const [p, s] = await Promise.all([
    sb.from('positions').select('*').order('sort_order').order('name'),
    sb.from('sites').select('*').order('status').order('name')
  ]);
  S.positions = p.data||[]; S.sites = s.data||[];
}

        if(error) throw error;

    toast('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว');
  };
}

      <td data-l="OT:" class="num">${money(e.ot_rate)}</td>
      <td>${starsHTML(Number(e.stars))}</td></tr>`).join('')}

        <dl class="idcard-body" style="margin:0">
          <div><dt>วันเกิด</dt><dd>${thaiDate(e.birth_date,false)}</dd></div>

          <div><dt>วันเริ่มงาน</dt><dd>${thaiDate(e.start_date,false)}</dd></div>

          <div><dt>อัตรา OT</dt><dd class="num">${money(e.ot_rate)} บาท/ชม.</dd></div>
          <div class="wide"><dt>คะแนนความประพฤติ</dt><dd>${starsHTML(Number(e.stars),true)} <span class="num" style="margin-left:6px">${Number(e.stars).toFixed(1)} / 5</span></dd></div>
        </dl>
      </div>
      ${readonly?'':'<p class="muted" style="font-size:13px;margin:12px 0 0"><button class="linkbtn" id="hist">ดูประวัติการแก้ไขข้อมูลคนนี้</button></p><div id="histBox"></div>'}
    </div>
    ${readonly?'':`<div class="modal-foot">${isAdmin()?'<button class="btn btn-danger" id="delEmp" style="margin-right:auto">ลบ</button>':''}<button class="btn" data-close>ปิด</button><button class="btn btn-primary" id="editEmp">แก้ไขข้อมูล</button></div>`}`);
  if(readonly) return;
  $('#editEmp',m.el).onclick=()=>{ m.close(); employeeForm(e); };
  $('#hist',m.el).onclick=()=>showHistory(e.id, $('#histBox',m.el));

    if(!await confirmBox(`ลบ ${fullName(e)} ออกจากระบบถาวร? ถ้าพนักงานลาออก แนะนำให้เปลี่ยนสถานะเป็น "ลาออกแล้ว" แทน เพื่อเก็บประวัติไว้`,'ลบถาวร',true)) return;

const FIELD_TH = {title:'คำนำหน้า',first_name:'ชื่อ',last_name:'นามสกุล',nickname:'ชื่อเล่น',birth_date:'วันเกิด',national_id:'เลขบัตร',id_address:'ที่อยู่',social_security_no:'เลขประกันสังคม',phone:'เบอร์โทร',position_id:'ตำแหน่ง',wage_type:'รูปแบบค่าจ้าง',wage_rate:'ค่าแรง',ot_rate:'อัตรา OT',start_date:'วันเริ่มงาน',status:'สถานะ',stars:'ดาว'};
async function showHistory(id, box){
  box.innerHTML='<p class="muted">กำลังโหลด</p>';
  const {data,error}=await sb.from('audit_log').select('*').eq('table_name','employees').eq('record_id',id).order('changed_at',{ascending:false}).limit(30);
  if(error){ box.innerHTML=''; return toast(errText(error),true); }
  if(!data.length){ box.innerHTML='<p class="muted">ยังไม่มีประวัติ</p>'; return; }
  const fmtv=(k,v)=> v==null||v===''?'-': k==='position_id'?(S.positions.find(p=>p.id===v)?.name||v): /date/.test(k)?thaiDate(v):v;
  box.innerHTML=`<ul class="slist">${data.map(a=>{
    const dt=new Date(a.changed_at);
    const when=`${thaiDate(localISO(dt))} ${dt.toTimeString().slice(0,5)}`;
    let what='';
    if(a.action==='INSERT') what='เพิ่มเข้าระบบ';
    else if(a.action==='UPDATE'){
      const ch=Object.keys(FIELD_TH).filter(k=>JSON.stringify(a.old_data?.[k])!==JSON.stringify(a.new_data?.[k]));
      what=ch.map(k=>`${FIELD_TH[k]}: ${esc(fmtv(k,a.old_data[k]))} → ${esc(fmtv(k,a.new_data[k]))}`).join('<br>')||'แก้ไข';
    } else what='ลบ';
    return `<li style="display:block;font-size:13px"><b>${when}</b> <span class="muted">โดย ${esc(a.changed_by_name||'ระบบ')}</span><br>${what}${a.reason?`<br><span class="muted">เหตุผล: ${esc(a.reason)}</span>`:''}</li>`;
  }).join('')}</ul>`;
}

function employeeForm(e){
  const isNew=!e; e=e||{title:'นาย',wage_type:'daily',wage_rate:0,ot_rate:0,status:'active',stars:5};
  const m=openModal(`<div class="modal-head"><h3>${isNew?'เพิ่มพนักงาน':'แก้ไขข้อมูล '+esc(e.first_name)}</h3><button data-close aria-label="ปิด">×</button></div>
    <form id="ef" novalidate><div class="modal-body">
      <fieldset class="fieldset"><legend>ข้อมูลส่วนตัว</legend>
        <div class="row row-3">
          <div class="field"><label>คำนำหน้า</label><select name="title">${TITLES.map(t=>`<option ${e.title===t?'selected':''}>${t}</option>`).join('')}</select></div>
          <div class="field"><label>ชื่อจริง *</label><input type="text" name="first_name" value="${esc(e.first_name)}" required></div>
          <div class="field"><label>นามสกุลจริง *</label><input type="text" name="last_name" value="${esc(e.last_name)}" required></div>
        </div>
        <div class="row row-2">
          <div class="field"><label>ชื่อเล่น</label><input type="text" name="nickname" value="${esc(e.nickname)}"></div>
          <div class="field"><label>เบอร์โทร</label><input type="tel" name="phone" value="${esc(e.phone)}"></div>
        </div>
        ${dateField('birth_date', e.birth_date, 'วัน/เดือน/ปีเกิด', e.birth_date?'อายุ '+ageText(e.birth_date):'อายุจะคำนวณอัตโนมัติ')}
      </fieldset>
      <fieldset class="fieldset"><legend>บัตรประชาชนและประกันสังคม</legend>
        <div class="row row-2">
          <div class="field"><label>เลขบัตรประชาชน (13 หลัก)</label><input type="text" name="national_id" inputmode="numeric" maxlength="17" value="${esc(e.national_id)}"><span class="err" id="idErr"></span></div>
          <div class="field"><label>เลขประกันสังคม</label><input type="text" name="social_security_no" inputmode="numeric" value="${esc(e.social_security_no)}"><span class="hint"><button type="button" class="linkbtn" id="sameId">ใช้เลขเดียวกับบัตรประชาชน</button></span></div>
        </div>
        <div class="field"><label>ที่อยู่ตามบัตรประชาชน</label><textarea name="id_address">${esc(e.id_address)}</textarea></div>
      </fieldset>
      <fieldset class="fieldset"><legend>การจ้างงาน</legend>
        <div class="row row-2">
          <div class="field"><label>ตำแหน่ง</label><select name="position_id"><option value="">ไม่ระบุ</option>${S.positions.map(p=>`<option value="${p.id}" ${e.position_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
          <div class="field"><label>สถานะ</label><select name="status"><option value="active" ${e.status==='active'?'selected':''}>ทำงานอยู่</option><option value="resigned" ${e.status==='resigned'?'selected':''}>ลาออกแล้ว</option></select></div>
        </div>
        ${dateField('start_date', e.start_date, 'วันเริ่มงาน', e.start_date?'อายุงาน '+serviceText(e.start_date):'')}
        <div class="row row-3">
          <div class="field"><label>รูปแบบค่าจ้าง</label><select name="wage_type"><option value="daily" ${e.wage_type==='daily'?'selected':''}>รายวัน</option><option value="monthly" ${e.wage_type==='monthly'?'selected':''}>รายเดือน</option></select></div>
          <div class="field"><label id="wageLbl">ค่าแรง (บาท/${e.wage_type==='monthly'?'เดือน':'วัน'})</label><input type="number" name="wage_rate" min="0" step="0.01" inputmode="decimal" value="${e.wage_rate}"></div>
          <div class="field"><label>ค่า OT (บาท/ชม.)</label><input type="number" name="ot_rate" min="0" step="0.01" inputmode="decimal" value="${e.ot_rate}"></div>
        </div>
        <div class="reason-box hidden" id="reasonBox"><div class="field" style="margin:0"><label>เหตุผลที่แก้ไขค่าแรง/OT *</label><input type="text" name="change_reason" placeholder="เช่น ปรับค่าแรงประจำปี"><span class="hint">บันทึกไว้ในประวัติการแก้ไข</span></div></div>
      </fieldset>
    </div>
    <div class="modal-foot"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn btn-primary" id="saveEmp">${isNew?'เพิ่มพนักงาน':'บันทึกการแก้ไข'}</button></div></form>`);
  const f=$('#ef',m.el), F=f.elements;
  const wageChanged=()=> !isNew && (Number(F.wage_rate.value)!==Number(e.wage_rate) || Number(F.ot_rate.value)!==Number(e.ot_rate) || F.wage_type.value!==e.wage_type);
  const toggleReason=()=>$('#reasonBox',m.el).classList.toggle('hidden', !wageChanged());
  ['wage_rate','ot_rate','wage_type'].forEach(n=>f[n].addEventListener('input',toggleReason));
  F.wage_type.addEventListener('change',()=>{ $('#wageLbl',m.el).textContent=`ค่าแรง (บาท/${F.wage_type.value==='monthly'?'เดือน':'วัน'})`; toggleReason(); });
  // คำนวณอายุสด
  const liveAge=(name, fn, prefix)=>$(`[data-date="${name}"]`,m.el).addEventListener('input',()=>{
    const r=readDate(m.el,name); $(`[data-hint="${name}"]`,m.el).textContent = r.ok&&r.value ? prefix+fn(r.value) : (r.ok?'':r.msg);
  });
  liveAge('birth_date', ageText, 'อายุ '); liveAge('start_date', serviceText, 'อายุงาน ');
  const idCheck=()=>{ const v=F.national_id.value.replace(/\D/g,''); $('#idErr',m.el).textContent = v && !validThaiId(v) ? (v.length!==13?`กรอกแล้ว ${v.length} หลัก ต้องมี 13 หลัก`:'เลขบัตรไม่ถูกต้อง (ตรวจหลักสุดท้ายไม่ผ่าน)') : ''; };
  F.national_id.addEventListener('input',idCheck);
  $('#sameId',m.el).onclick=()=>{ F.social_security_no.value=F.national_id.value.replace(/\D/g,''); };

  f.onsubmit=async ev=>{
    ev.preventDefault();
    const btn=$('#saveEmp',m.el);
    const bd=readDate(m.el,'birth_date'), sd=readDate(m.el,'start_date');
    if(!F.first_name.value.trim() || !F.last_name.value.trim()) return toast('กรอกชื่อและนามสกุล',true);
    if(!bd.ok) return toast('วันเกิด: '+bd.msg,true);
    if(!sd.ok) return toast('วันเริ่มงาน: '+sd.msg,true);
    const nid=F.national_id.value.replace(/\D/g,'');
    if(nid && !validThaiId(nid)) return toast('เลขบัตรประชาชนไม่ถูกต้อง',true);
    const reason=F.change_reason.value.trim();
    if(wageChanged() && !reason) return toast('ระบุเหตุผลที่แก้ไขค่าแรง/OT',true);
    const row={
      title:F.title.value, first_name:F.first_name.value.trim(), last_name:F.last_name.value.trim(),
      nickname:F.nickname.value.trim()||null, phone:F.phone.value.trim()||null,
      birth_date:bd.value, national_id:nid||null, social_security_no:F.social_security_no.value.replace(/\s/g,'')||null,
      id_address:F.id_address.value.trim()||null, position_id:F.position_id.value?Number(F.position_id.value):null,
      status:F.status.value, start_date:sd.value, wage_type:F.wage_type.value,
      wage_rate:Number(F.wage_rate.value||0), ot_rate:Number(F.ot_rate.value||0),
      change_reason: isNew ? 'เพิ่มพนักงานใหม่' : (reason||null)
    };
    busy(btn,true);
    const q = isNew ? sb.from('employees').insert(row) : sb.from('employees').update(row).eq('id',e.id);
    const {error}=await q;
    if(error){ busy(btn,false); return toast(errText(error),true); }
    m.close(); toast(isNew?'เพิ่มพนักงานแล้ว':'บันทึกการแก้ไขแล้ว'); reloadEmployees();
  };
}

/* =====================================================================
   ผู้ใช้ระบบ (แอดมิน)
   ===================================================================== */
async function pageUsers(){
  setPage(`<div class="page-head"><div><h2>ผู้ใช้ระบบ</h2><p>อนุมัติผู้สมัคร กำหนดสิทธิ์ ผูกกับข้อมูลพนักงาน และไซต์ที่รับผิดชอบ</p></div></div><div class="card" id="uList"><div class="loading" style="min-height:120px"><div class="spin"></div></div></div>`);
  const [u, e, a] = await Promise.all([
    sb.from('profiles').select('*').order('created_at',{ascending:false}),
    sb.from('employees').select('id,title,first_name,last_name,nickname,status').order('first_name'),
    sb.from('site_assignments').select('*')
  ]);
  if(u.error) return toast(errText(u.error),true);
  const users=(u.data||[]).sort((x,y)=>(x.role==='pending'?0:1)-(y.role==='pending'?0:1));
  const emps=e.data||[], assigns=a.data||[];
  const activeSites=S.sites.filter(s=>s.status==='active');
  $('#uList').innerHTML = users.map(p=>{
    const mine=assigns.filter(x=>x.user_id===p.id).map(x=>x.site_id);
    const me=p.id===S.profile.id;
    return `<div class="urow ${p.role==='pending'?'pending':''}" data-id="${p.id}">
      <div><b>${esc(p.display_name)}</b>${me?' <span class="tag">คุณ</span>':''}${p.role==='pending'?' <span class="tag tag-warn">รออนุมัติ</span>':''}${!p.is_active?' <span class="tag tag-bad">ระงับ</span>':''}
        <div class="muted" style="font-size:13px">${esc(p.email)}${p.phone?' · '+esc(p.phone):''}</div>
        <div class="muted" style="font-size:12px">สมัคร ${thaiDate(localISO(new Date(p.created_at)))}</div></div>
      <div class="field" style="margin:0"><label>สิทธิ์</label><select data-k="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="margin:0"><label>ผูกกับพนักงาน</label><select data-k="employee_id"><option value="">ไม่ผูก</option>${emps.map(x=>`<option value="${x.id}" ${p.employee_id===x.id?'selected':''}>${esc(x.first_name+' '+x.last_name)}${x.nickname?' ('+esc(x.nickname)+')':''}</option>`).join('')}</select></div>
      <div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap">
        <label class="chip"><input type="checkbox" data-k="is_active" ${p.is_active?'checked':''}> ใช้งาน</label>
        <button class="btn btn-primary btn-sm" data-save>บันทึก</button></div>
      <div class="sites ${p.role==='foreman'?'':'hidden'}" style="grid-column:1/-1">
        <span class="muted" style="font-size:13px">ไซต์ที่รับผิดชอบ</span>
        <div class="chips">${activeSites.length?activeSites.map(s=>`<label class="chip"><input type="checkbox" data-site="${s.id}" ${mine.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join(''):'<span class="muted" style="font-size:13px">ยังไม่มีไซต์ เพิ่มได้ที่หน้าตั้งค่า</span>'}</div></div>
    </div>`;
  }).join('') || '<div class="empty"><b>ยังไม่มีผู้ใช้</b></div>';

  document.querySelectorAll('.urow').forEach(row=>{
    const id=row.dataset.id;
    $('[data-k=role]',row).addEventListener('change',ev=>$('.sites',row).classList.toggle('hidden', ev.target.value!=='foreman'));
    $('[data-save]',row).onclick=async ev=>{
      const btn=ev.target;
      const upd={ role:$('[data-k=role]',row).value, employee_id:$('[data-k=employee_id]',row).value||null, is_active:$('[data-k=is_active]',row).checked };
      busy(btn,true,'...');
      const {error}=await sb.from('profiles').update(upd).eq('id',id);
      if(error){ busy(btn,false); return toast(errText(error),true); }
      // ไซต์ที่รับผิดชอบ
      const want=[...row.querySelectorAll('[data-site]')].filter(c=>c.checked && upd.role==='foreman').map(c=>Number(c.dataset.site));
      const had=assigns.filter(x=>x.user_id===id).map(x=>x.site_id);
      const add=want.filter(s=>!had.includes(s)), rem=had.filter(s=>!want.includes(s));
      if(add.length){ const r=await sb.from('site_assignments').insert(add.map(site_id=>({user_id:id,site_id}))); if(r.error){ busy(btn,false); return toast(errText(r.error),true);} }
      if(rem.length){ const r=await sb.from('site_assignments').delete().eq('user_id',id).in('site_id',rem); if(r.error){ busy(btn,false); return toast(errText(r.error),true);} }
      toast('บันทึกสิทธิ์แล้ว');
      if(id===S.profile.id){ await enter(); } else pageUsers();
    };
  });
}

        <ul class="slist">${S.positions.map(p=>`<li><span>${esc(p.name)}</span><button class="btn btn-sm" data-ren="${p.id}">เปลี่ยนชื่อ</button><button class="btn btn-sm btn-danger" data-delp="${p.id}">ลบ</button></li>`).join('')}</ul></div>
      <div class="card card-pad"><h3 class="section-title">ไซต์งาน</h3>
        <form id="addSite" style="margin-bottom:6px"><div class="row row-2"><input type="text" name="n" placeholder="ชื่อไซต์ เช่น บ้านคุณไพศาล" aria-label="ชื่อไซต์"><input type="text" name="l" placeholder="ที่ตั้ง (ไม่บังคับ)" aria-label="ที่ตั้ง"></div><button class="btn btn-primary" style="margin-top:8px">เพิ่มไซต์</button></form>
        <ul class="slist">${S.sites.map(s=>`<li><span>${esc(s.name)}${s.location?`<br><small class="muted">${esc(s.location)}</small>`:''}</span>${s.status==='active'?'<span class="tag tag-ok">เปิดอยู่</span>':'<span class="tag">ปิดแล้ว</span>'}<button class="btn btn-sm" data-ts="${s.id}">${s.status==='active'?'ปิดไซต์':'เปิดอีกครั้ง'}</button></li>`).join('')||'<li class="muted">ยังไม่มีไซต์งาน</li>'}</ul></div>
    </div>`);
  const after=async msg=>{ toast(msg); await loadRefs(); pageSettings(); };
  $('#addPos').onsubmit=async ev=>{
    ev.preventDefault(); const name=$('input',ev.target).value.trim(); if(!name) return;
    const {error}=await sb.from('positions').insert({name, sort_order:S.positions.length+1});
    if(error) return toast(/duplicate/.test(error.message)?'มีตำแหน่งนี้แล้ว':errText(error),true); after('เพิ่มตำแหน่งแล้ว');
  };
  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{
    const p=S.positions.find(x=>x.id==b.dataset.ren); const name=prompt('ชื่อตำแหน่งใหม่',p.name); if(!name||name.trim()===p.name) return;
    const {error}=await sb.from('positions').update({name:name.trim()}).eq('id',p.id); if(error) return toast(errText(error),true); after('เปลี่ยนชื่อแล้ว');
  });
  document.querySelectorAll('[data-delp]').forEach(b=>b.onclick=async()=>{
    const p=S.positions.find(x=>x.id==b.dataset.delp);
    if(!await confirmBox(`ลบตำแหน่ง "${p.name}"? พนักงานที่อยู่ตำแหน่งนี้จะกลายเป็น "ไม่ระบุตำแหน่ง"`,'ลบ',true)) return;
    const {error}=await sb.from('positions').delete().eq('id',p.id); if(error) return toast(errText(error),true); after('ลบตำแหน่งแล้ว');
  });
  $('#addSite').onsubmit=async ev=>{
    ev.preventDefault(); const f=ev.target; const name=f.n.value.trim(); if(!name) return toast('กรอกชื่อไซต์',true);
    const {error}=await sb.from('sites').insert({name, location:f.l.value.trim()||null}); if(error) return toast(errText(error),true); after('เพิ่มไซต์แล้ว');
  };
  document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=async()=>{
    const s=S.sites.find(x=>x.id==b.dataset.ts);
    const {error}=await sb.from('sites').update({status:s.status==='active'?'closed':'active'}).eq('id',s.id); if(error) return toast(errText(error),true);
    after(s.status==='active'?'ปิดไซต์แล้ว':'เปิดไซต์แล้ว');
  });
}

/* =====================================================================
   ข้อมูลของฉัน
   ===================================================================== */
async function pageMe(){
  const p=S.profile;
  setPage(`<div class="page-head"><div><h2>ข้อมูลของฉัน</h2><p>${ROLES[p.role]}</p></div></div>
    <div class="grid-2">
      <div class="card card-pad"><h3 class="section-title">บัญชีผู้ใช้</h3>
        <form id="meF"><div class="field"><label>อีเมล</label><input type="email" value="${esc(p.email)}" disabled></div>
        <div class="field"><label>ชื่อที่แสดง</label><input type="text" name="dn" value="${esc(p.display_name)}"></div>
        <div class="field"><label>เบอร์โทร</label><input type="tel" name="ph" value="${esc(p.phone)}"></div>
        <button class="btn btn-primary">บันทึก</button></form>
        <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
        <form id="pwF"><div class="field"><label>เปลี่ยนรหัสผ่าน</label><input type="password" name="pw" minlength="6" placeholder="รหัสผ่านใหม่ อย่างน้อย 6 ตัว" autocomplete="new-password"></div>
        <button class="btn">เปลี่ยนรหัสผ่าน</button></form></div>
      <div id="myEmp"></div>
    </div>`);
  $('#meF').onsubmit=async ev=>{
    ev.preventDefault(); const f=ev.target;
    const {error}=await sb.from('profiles').update({display_name:f.dn.value.trim(), phone:f.ph.value.trim()||null}).eq('id',p.id);
    if(error) return toast(errText(error),true);
    S.profile.display_name=f.dn.value.trim(); S.profile.phone=f.ph.value.trim(); toast('บันทึกแล้ว'); route();
  };
  $('#pwF').onsubmit=async ev=>{
    ev.preventDefault(); const pw=ev.target.pw.value;
    if(pw.length<6) return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',true);
    const {error}=await sb.auth.updateUser({password:pw}); if(error) return toast(errText(error),true);
    ev.target.reset(); toast('เปลี่ยนรหัสผ่านแล้ว');
  };
  if(p.employee_id){
    const {data}=await sb.from('employees').select('*').eq('id',p.employee_id).single();
    if(data){
      $('#myEmp').innerHTML=`<div class="card card-pad"><h3 class="section-title">ข้อมูลพนักงาน</h3>
        <p style="margin:0 0 8px">${esc(fullName(data))}${data.nickname?` (${esc(data.nickname)})`:''}</p>
        <p class="muted" style="margin:0 0 8px">${esc(S.positions.find(x=>x.id===data.position_id)?.name||'-')} · อายุ ${ageText(data.birth_date)}</p>
        <p style="margin:0 0 14px">${starsHTML(Number(data.stars),true)} <span class="num">${Number(data.stars).toFixed(1)} / 5</span></p>
        <button class="btn" id="seeCard">ดูข้อมูลทั้งหมด</button></div>`;
      $('#seeCard').onclick=()=>employeeCard(data,true);
    }
  } else {
    $('#myEmp').innerHTML=`<div class="card card-pad"><h3 class="section-title">ข้อมูลพนักงาน</h3><p class="muted" style="margin:0">บัญชีนี้ยังไม่ได้ผูกกับข้อมูลพนักงาน แอดมินผูกให้ได้ที่หน้าผู้ใช้ระบบ</p></div>`;
  }
}

boot();
</script>
</body>
</html>
